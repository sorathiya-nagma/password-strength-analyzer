 {% load static %}
 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | CipherGuard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="container-fluid login-page">

    <div class="row vh-100">

        <!-- Left Side -->

        <div class="col-lg-6 left-side">

            <img src="{% static 'image/website_image.png' %}"
                 class="login-image"
                 alt="Cyber Security">

            <h1>Protect Your Digital Life</h1>

            <p>
                Analyze password strength in real time and build
                stronger passwords with CipherGuard.
            </p>

        </div>

        <!-- Right Side -->

        <div class="col-lg-6 right-side">

            <div class="login-card">

                <h2>

                    <i class="bi bi-shield-lock-fill text-primary"></i>

                    CipherGuard

                </h2>

                <p class="welcome-text">
                    Welcome Back
                </p>

                 <form method="POST">

    {% csrf_token %}

    <label>Username</label>

    <input
    type="text"
    name="username"
    class="form-control mb-3 email-text"
    placeholder="Enter your username"
    autocomplete="off"
    required>


    <label>Password</label>

    <div class="input-group mb-3">

        <input
        type="password"
        name="password"
        id="password"
        class="form-control pass-text"
        placeholder="Enter your password"
        autocomplete="new-password"
        required>


        <button
        type="button"
        class="btn btn-dark"
        id="togglePassword">

            <i class="bi bi-eye"></i>

        </button>

    </div>


    <div class="d-flex justify-content-between mb-4">

             <div class="remember-text">

                <input type="checkbox">

                    Remember Me

            </div>

             <a href="#">Forgot Password?</a>

            </div>


             <button type="submit" class="btn btn-primary w-100">
                     Login
            </button>
                    {% if error %}
                        <p class="text-danger">{{ error }}</p>
                    {% endif %}

            <div class="text-center mt-4 register-text">

                 Don't have an account?

                <a href="{% url 'register' %}">
                Register
                </a>

             </div>


        </form>
            </div>

        </div>

    </div>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>

</html>
